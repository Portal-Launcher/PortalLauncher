name: Bug Report
description: File a bug report
labels: ["bug: unconfirmed", "status: needs triage"]
body:
- type: markdown
  attributes:
    value: |
      Portal Launcher is a fork of Prism Launcher. **Please report Portal bugs here, not to the Prism Launcher project.**
      If something is broken in Portal it is this fork's fault, and upstream cannot help with it.

      Before submitting a bug report, please make sure you have read this *entire* form, and that:
      * Your bug is not caused by Minecraft or any mods you have installed.
      * Your issue has not been reported before, [make sure to use the search function!](https://github.com/TinsleyDevers/PortalLauncher/issues)

      **Do not forget to give your issue a descriptive title.** "Bug in the instance screen" makes it hard to distinguish issues at a glance.
- type: dropdown
  attributes:
    label: Operating System
    description: If you know this bug occurs on multiple operating systems, select all you have tested.
    multiple: true
    options:
    - Windows
    - macOS
    - Linux
    - Other
- type: textarea
  attributes:
    label: Version of Portal Launcher
    description: The version of Portal Launcher used in the bug report. You can find it in Help -> About Portal Launcher.
    placeholder: Portal Launcher 1.0.5
  validations:
    required: true
- type: textarea
  attributes:
    label: Version of Qt
    description: The version of Qt used in the bug report. You can find it in Help -> About Portal Launcher -> About Qt.
    placeholder: Qt 6.10.2
  validations:
    required: true
- type: textarea
  attributes:
    label: Description of bug
    description: What did you expect to happen, what happened, and why is it incorrect?
    placeholder: The pack should have synced before launching, but it launched with the old mods.
  validations:
    required: true
- type: textarea
  attributes:
    label: Steps to reproduce
    description: A bulleted list, or an exported instance if relevant.
    placeholder: "* Open the Sharing page of an instance"
  validations:
    required: true
- type: textarea
  attributes:
    label: Suspected cause
    description: If you know what could be causing this bug, describe it here.
  validations:
    required: false
- type: checkboxes
  attributes:
    label: This issue is unique
    options:
    - label: I have searched the issue tracker and did not find an issue describing my bug.
      required: true
    - label: This is a bug in Portal Launcher, not in Prism Launcher. (If it happens in Prism Launcher too, please report it upstream instead.)
      required: true
