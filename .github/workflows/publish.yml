name: Publish

on:
  release:
    types: [ released ]
  # Release events do not reach Actions from this repository any more than
  # tag pushes do; run it by hand with the tag once the release is public.
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (e.g. 1.0.7)
        required: true
        type: string

permissions: {}

jobs:
  winget:
    name: Winget

    # Needs a WINGET_TOKEN secret: a personal access token with public_repo
    # scope, on an account that has forked microsoft/winget-pkgs. Without it
    # this job fails and nothing else is affected. See packaging/README.md.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}

    permissions:
      contents: read

    runs-on: ubuntu-slim

    steps:
      - name: Publish on Winget
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: PortalLauncher.PortalLauncher
          version: ${{ inputs.tag || github.event.release.tag_name }}
          # Only the x64 installer for now. The arm64 Setup can join once the
          # Windows arm64 build has proved itself in CI.
          installers-regex: '^PortalLauncher-Setup-[\d.]+\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
