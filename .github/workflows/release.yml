name: Build Application and Make Release

on:
  push:
    tags:
      - "*"
  # Fallback for when a tag push does not reach Actions: dispatch this
  # workflow with the tag as the ref (gh workflow run release.yml --ref N.N.N)
  # and it behaves exactly like the tag push would have.
  workflow_dispatch:

permissions: {}

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      # Required for Azure Trusted Signing
      id-token: write
      # Required for vcpkg binary cache
      packages: write
    with:
      build-type: Release
      environment: Release
    secrets: inherit

  create_release:
    needs: build_release
    permissions:
      contents: write
      # Both required by actions/attest-build-provenance
      id-token: write
      attestations: write
    runs-on: ubuntu-slim
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "true"
          path: "PortalLauncher-source"
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Grab and store version
        run: |
          tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
          echo "VERSION=$tag_name" >> $GITHUB_ENV
      - name: Package artifacts properly
        run: |
          mv ${{ github.workspace }}/PortalLauncher-source PortalLauncher-${{ env.VERSION }}
          # Four downloads, one per platform, plus the plain zip the in-app
          # updater installs from. Everything else the build makes (portable
          # variants, source tarball, zsync) stays a CI artifact.
          mv PortalLauncher-*.AppImage/PortalLauncher-*-x86_64.AppImage PortalLauncher-Linux-x86_64.AppImage
          mv PortalLauncher-macOS*/PortalLauncher.dmg PortalLauncher-macOS-${{ env.VERSION }}.dmg

          # Naming rules the in-app updater depends on (validReleaseArtifacts in
          # PrismUpdater.cpp): the zip is only offered as an update when its
          # name contains the build artifact ("Windows-MSVC"). The installer is
          # named WITHOUT it on purpose, so the updater can never pick the
          # Setup.exe when it means to unpack a zip.
          for d in PortalLauncher-Windows-MSVC*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            if [ -n "${PORT}" ]; then cd ..; continue; fi
            test -z "${INST}" || mv PrismLauncher-*.exe ../PortalLauncher-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../PortalLauncher-Windows-MSVC-${{ env.VERSION }}.zip" *
            cd ..
          done

      - name: Check the update archives are safe to ship
        run: python3 PortalLauncher-${{ env.VERSION }}/.github/scripts/check-update-archives.py

      - name: Write checksums
        run: |
          for f in PortalLauncher-*.zip PortalLauncher-*.exe PortalLauncher-*.AppImage PortalLauncher-*.dmg; do
            [ -f "$f" ] || continue
            sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"
          done
          ls -1 *.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            PortalLauncher-*.zip
            PortalLauncher-*.exe
            PortalLauncher-*.AppImage
            PortalLauncher-*.dmg

      - name: Write the provenance section of the release notes
        env:
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 PortalLauncher-${{ env.VERSION }}/.github/scripts/write-release-body.py "$VERSION" "$COMMIT" "$REPO" > release-body.md
          cat release-body.md

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref }}
          name: Portal Launcher ${{ env.VERSION }}
          body_path: release-body.md
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            PortalLauncher-Setup-${{ env.VERSION }}.exe
            PortalLauncher-Windows-MSVC-${{ env.VERSION }}.zip
            PortalLauncher-macOS-${{ env.VERSION }}.dmg
            PortalLauncher-Linux-x86_64.AppImage
            *.sha256
