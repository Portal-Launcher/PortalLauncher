name: Build Application and Make Release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      # Required for Azure Trusted Signing
      id-token: write
      # Required for vcpkg binary cache
      packages: write
    with:
      build-type: Release
      environment: Release
    secrets: inherit

  create_release:
    needs: build_release
    permissions:
      contents: write
      # Both required by actions/attest-build-provenance
      id-token: write
      attestations: write
    runs-on: ubuntu-slim
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "true"
          path: "PortalLauncher-source"
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Grab and store version
        run: |
          tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
          echo "VERSION=$tag_name" >> $GITHUB_ENV
      - name: Package artifacts properly
        run: |
          mv ${{ github.workspace }}/PortalLauncher-source PortalLauncher-${{ env.VERSION }}
          mv PortalLauncher-Linux-Qt6-Portable*/PortalLauncher-portable.tar.gz PortalLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv PortalLauncher-Linux-aarch64-Qt6-Portable*/PortalLauncher-portable.tar.gz PortalLauncher-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv PortalLauncher-*.AppImage/PortalLauncher-*-x86_64.AppImage PortalLauncher-Linux-x86_64.AppImage
          mv PortalLauncher-*.AppImage.zsync/PortalLauncher-*-x86_64.AppImage.zsync PortalLauncher-Linux-x86_64.AppImage.zsync
          mv PortalLauncher-*.AppImage/PortalLauncher-*-aarch64.AppImage PortalLauncher-Linux-aarch64.AppImage
          mv PortalLauncher-*.AppImage.zsync/PortalLauncher-*-aarch64.AppImage.zsync PortalLauncher-Linux-aarch64.AppImage.zsync
          mv PortalLauncher-macOS*/PortalLauncher.zip PortalLauncher-macOS-${{ env.VERSION }}.zip
          mv PortalLauncher-macOS*/PortalLauncher.dmg PortalLauncher-macOS-${{ env.VERSION }}.dmg

          tar --exclude='.git' -czf PortalLauncher-${{ env.VERSION }}.tar.gz PortalLauncher-${{ env.VERSION }}

          # Naming rules the in-app updater depends on (validReleaseArtifacts in
          # PrismUpdater.cpp): an archive is only offered as an update when its
          # name contains the build artifact ("Windows-MSVC"), and arm64 and
          # portable builds are told apart by name too. The installers are named
          # WITHOUT the build artifact on purpose, so the updater can never pick
          # a Setup.exe when it means to unpack a zip.
          for d in PortalLauncher-Windows-MSVC*; do
            cd "${d}" || continue
            ARM64="$(echo -n ${d} | grep -o arm64 || true)"
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="PortalLauncher-Windows-MSVC"
            SETUP_NAME="PortalLauncher-Setup"
            test -z "${ARM64}" || NAME="${NAME}-arm64"
            test -z "${ARM64}" || SETUP_NAME="${SETUP_NAME}-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv PrismLauncher-*.exe ../${SETUP_NAME}-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in PortalLauncher-Windows-MinGW-w64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="PortalLauncher-Windows-MinGW-w64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv PrismLauncher-*.exe ../PortalLauncher-MinGW-w64-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done


      - name: Check the update archives are safe to ship
        run: python3 PortalLauncher-${{ env.VERSION }}/.github/scripts/check-update-archives.py

      - name: Write checksums
        run: |
          for f in PortalLauncher-*.zip PortalLauncher-*.exe PortalLauncher-*.tar.gz PortalLauncher-*.AppImage PortalLauncher-*.dmg; do
            [ -f "$f" ] || continue
            sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"
          done
          ls -1 *.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            PortalLauncher-*.zip
            PortalLauncher-*.exe
            PortalLauncher-*.tar.gz
            PortalLauncher-*.AppImage
            PortalLauncher-*.dmg

      - name: Write the provenance section of the release notes
        env:
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 PortalLauncher-${{ env.VERSION }}/.github/scripts/write-release-body.py "$VERSION" "$COMMIT" "$REPO" > release-body.md
          cat release-body.md

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref }}
          name: Portal Launcher ${{ env.VERSION }}
          body_path: release-body.md
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            PortalLauncher-Linux-x86_64.AppImage
            PortalLauncher-Linux-x86_64.AppImage.zsync
            PortalLauncher-Linux-aarch64.AppImage
            PortalLauncher-Linux-aarch64.AppImage.zsync
            PortalLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
            PortalLauncher-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
            PortalLauncher-Windows-MinGW-w64-${{ env.VERSION }}.zip
            PortalLauncher-Windows-MinGW-w64-Portable-${{ env.VERSION }}.zip
            PortalLauncher-MinGW-w64-Setup-${{ env.VERSION }}.exe
            PortalLauncher-Windows-MSVC-arm64-${{ env.VERSION }}.zip
            PortalLauncher-Windows-MSVC-arm64-Portable-${{ env.VERSION }}.zip
            PortalLauncher-Setup-arm64-${{ env.VERSION }}.exe
            PortalLauncher-Windows-MSVC-${{ env.VERSION }}.zip
            PortalLauncher-Windows-MSVC-Portable-${{ env.VERSION }}.zip
            PortalLauncher-Setup-${{ env.VERSION }}.exe
            PortalLauncher-macOS-${{ env.VERSION }}.zip
            PortalLauncher-macOS-${{ env.VERSION }}.dmg
            PortalLauncher-${{ env.VERSION }}.tar.gz
            *.sha256
