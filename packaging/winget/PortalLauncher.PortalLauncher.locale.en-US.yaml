ShortDescription: A Minecraft launcher for playing modpacks with friends, built on Prism Launcher.
Description: |-
  Portal Launcher is an open source Minecraft launcher for sharing and automatically
  syncing modpacks with friends. It is a fork of Prism Launcher, and is not endorsed
  by or affiliated with the Prism Launcher project.

  Share an instance once and everyone who joins stays on the same mods, configs,
  Minecraft version and mod loader automatically, using Modrinth's official Shared
  Instances service. It also adds a Modrinth friends panel, Discord rich presence,
  a full mod page when browsing Modrinth and CurseForge, safer mod updates that can
  be rolled back, and modpack update notifications.

  The installer is per user and needs no administrator rights. Releases are built by
  GitHub Actions and publish a signed build provenance attestation.
